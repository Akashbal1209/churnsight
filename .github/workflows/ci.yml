name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt pytest ruff httpx
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src app tests --select E,F --ignore E501
      - name: Test
        run: pytest -q
